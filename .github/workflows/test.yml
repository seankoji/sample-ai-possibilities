name: CI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Python Tests & Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Python Syntax & Bytecode Compilation Check
        run: |
          python -m compileall agentic-football-sample-agents/lib agentic-football-sample-agents/ai-team-*

      - name: Run Agentic Football Unified Test Runner
        working-directory: agentic-football-sample-agents
        run: |
          python -m pip install coverage==7.16.1
          python -m coverage run run_tests.py --integration
          python -m coverage combine
          python -m coverage xml

      - name: Retain Cobertura coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: agentic-football-sample-agents/coverage/coverage.xml
          if-no-files-found: error
